name: Publicar npm

# Publica npm/ en npm con trusted publishing (OIDC): sin token ni código de 2FA.
# Requiere el Trusted Publisher configurado en npmjs.com (paquete leyes-mx →
# Settings → Trusted Publisher → GitHub Actions, workflow publicar-npm.yml).
# Se dispara a mano; publica la versión que diga npm/package.json en main.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Versión
        working-directory: npm
        run: |
          v=$(node -p "require('./package.json').version")
          echo "Local: $v"
          if npm view "leyes-mx@$v" version >/dev/null 2>&1; then
            echo "::error::leyes-mx@$v ya está publicada; sube la versión en npm/package.json"; exit 1
          fi
      - name: Pruebas
        working-directory: npm
        run: npm ci && npm test
      - name: Publicar
        working-directory: npm
        run: npm publish --access public
