[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leyes-mx"
version = "0.1.0"
description = "Leyes fiscales y laborales de México en Markdown, un archivo por artículo, con buscador local"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
leyes-mx = "leyes_mx.cli:main"

[tool.setuptools]
packages = ["leyes_mx"]
